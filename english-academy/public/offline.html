<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · English Academy</title>
<style>
  :root { --paper: #f7f5f0; --ink: #1b2433; --ink-2: #4a5263; --navy: #223a5e; }
  @media (prefers-color-scheme: dark) { :root { --paper: #14171c; --ink: #ebe7df; --ink-2: #b9b5ad; --navy: #9db8de; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { max-width: 420px; text-align: center; }
  h1 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-weight: 400; }
  p { color: var(--ink-2); }
  a { color: var(--navy); }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page has not been saved for offline use yet. Pages you visited recently, your vocabulary list and a downloaded study session still work.</p>
  <p><a href="/learn/session?mode=mixed">Continue your downloaded session</a> · <a href="/vocabulary">Vocabulary</a></p>
  <p>Answers you give offline are kept on this device and sync when you reconnect.</p>
</main>
</body>
</html>
